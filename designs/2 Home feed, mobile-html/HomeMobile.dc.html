<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>atmo.town: Home feed, mobile</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;family=Pixelify+Sans:wght@400;600&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}
</style>
</helmet>
<div style="width: 390px; min-height: 1700px">
<dc-import name="Home" device="mobile" view="{{view}}" sky="{{sky}}" hint-size="390px,1700px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"view":{"editor":"enum","options":["signedIn","signedOut","quiet"],"default":"signedOut"},"sky":{"editor":"enum","options":["day","dusk"],"default":"dusk"},"$preview":{"width":390,"height":1700}}'>
class Component extends DCLogic {
  renderVals() {
    return { view: this.props.view ?? 'signedOut', sky: this.props.sky ?? 'dusk' };
  }
}
</script>
</body>
</html>
