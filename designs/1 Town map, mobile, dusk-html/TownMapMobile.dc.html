<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>atmo.town: Town square map, mobile</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;family=Pixelify+Sans:wght@400;600&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}
@keyframes atStep{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.at-walk{animation:atStep .5s steps(2) infinite}
</style>
</helmet>
<div style="width: 390px; min-height: 980px; box-sizing: border-box; display: flex; flex-direction: column; background: linear-gradient(180deg, {{t.sky2}} 0%, {{t.sky3}} 30%, {{t.page}} 60%); color: {{t.ink}}; font-family: 'Bricolage Grotesque', 'Trebuchet MS', sans-serif">

<header style="display: flex; align-items: center; gap: 8px; padding: 12px 16px; background: {{t.deckA}}; border-bottom: 2px solid {{t.line}}">
<a href="TownMapMobile.dc.html" style="display: flex; align-items: center; gap: 8px; flex: 1; text-decoration: none; font-family: 'Pixelify Sans', monospace; font-size: 22px; font-weight: 600">
<svg width="24" height="24" viewBox="0 0 14 14" shape-rendering="crispEdges" aria-hidden="true"><rect x="6" y="1" width="2" height="1" fill="{{t.ember}}"></rect><rect x="4" y="2" width="6" height="2" fill="{{t.ember}}"></rect><rect x="2" y="4" width="10" height="2" fill="{{t.ember}}"></rect><rect x="3" y="6" width="8" height="7" fill="{{t.wall}}" stroke="{{t.ink}}" stroke-width=".5"></rect><rect x="6" y="9" width="2" height="4" fill="{{t.ink}}"></rect><rect x="4" y="7" width="2" height="2" fill="{{t.win}}"></rect><rect x="8" y="7" width="2" height="2" fill="{{t.win}}"></rect></svg>
atmo.town
</a>
<button type="button" onClick="{{toggleSky}}" aria-label="{{skyAria}}" style="display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; border: 2px solid {{t.line}}; background: {{t.deck2}}; cursor: pointer">
<span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 50%; background: {{t.glow}}"></span>
</button>
<a href="NotificationsMobile.dc.html" aria-label="Mailbox, 2 unread" style="position: relative; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; border: 2px solid {{t.line}}; background: {{t.deck2}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10a5 5 0 0 1 10 0v9H4z"></path><path d="M14 10h6v9h-6"></path><path d="M9 3v4h4"></path></svg>
<span aria-hidden="true" style="position: absolute; top: -4px; right: -4px; width: 12px; height: 12px; border-radius: 50%; background: {{t.ember}}; border: 2px solid {{t.deck}}"></span>
</a>
</header>

<main style="flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 16px">

<a href="LiveDrawMobile.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: {{t.deck}}; border: 2px solid {{t.ember}}; text-decoration: none">
<span aria-hidden="true" style="width: 10px; height: 10px; flex: none; border-radius: 50%; background: {{t.ember}}"></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font-family: 'Pixelify Sans', monospace; font-size: 14px; color: {{t.emberText}}">Live on Streamplace</span>
<span style="font-weight: 600; font-size: 15px">Domain White Elephant draw</span>
</span>
<span style="font-weight: 800; font-size: 14px; color: {{t.emberText}}">Watch</span>
</a>

<h1 style="margin: 4px 0 0; font-size: 34px; line-height: 1; font-weight: 800; letter-spacing: -0.02em">Town square</h1>

<section aria-label="Town map" style="position: relative; height: 560px; border-radius: 24px; overflow: hidden; border: 3px solid {{t.line}}; background: linear-gradient(180deg, {{t.sky1}} 0%, {{t.sky2}} 14%, {{t.sky3}} 22%, {{t.sky4}} 28%, {{t.sky5}} 32%)">
<sc-if value="{{skyIsDusk}}" hint-placeholder-val="{{ true }}">
<div aria-hidden="true" style="position: absolute; left: 76%; top: 4%; width: 34px; height: 34px; border-radius: 50%; background: #fff3d6; box-shadow: 0 0 24px 6px rgba(255,196,107,.35)"></div>
<sc-for list="{{stars}}" as="s" hint-placeholder-count="8">
<div aria-hidden="true" style="position: absolute; left: {{s.x}}; top: {{s.y}}; width: 2px; height: 2px; background: #fff"></div>
</sc-for>
</sc-if>
<sc-if value="{{skyIsDay}}" hint-placeholder-val="{{ false }}">
<div aria-hidden="true" style="position: absolute; left: 76%; top: 4%; width: 40px; height: 40px; border-radius: 50%; background: #ffd56b"></div>
<div aria-hidden="true" style="position: absolute; left: 10%; top: 6%; width: 90px; height: 24px; border-radius: 999px; background: rgba(255,255,255,.85)"></div>
</sc-if>
<div aria-hidden="true" style="position: absolute; left: -20%; right: -20%; top: 24%; bottom: 0; border-radius: 50% 50% 0 0 / 8% 8% 0 0; background: {{t.grass2}}"></div>
<div aria-hidden="true" style="position: absolute; left: -10%; right: -10%; top: 30%; bottom: 0; border-radius: 50% 50% 0 0 / 6% 6% 0 0; background: {{t.grass}}"></div>
<svg aria-hidden="true" viewBox="0 0 360 560" preserveAspectRatio="none" style="position: absolute; inset: 0; width: 100%; height: 100%">
<path d="M180 185 C 180 230, 70 230, 80 300 S 290 330, 280 400 S 180 440, 180 480" fill="none" stroke="{{t.path}}" stroke-width="20" stroke-linecap="round"></path>
<ellipse cx="180" cy="490" rx="90" ry="30" fill="{{t.path}}"></ellipse>
</svg>

<a href="EventPageMobile.dc.html" style="position: absolute; left: 50%; top: 33%; translate: -50% -100%; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none">
<svg width="140" height="102" viewBox="0 0 200 146" aria-hidden="true">
<rect x="98" y="4" width="2" height="22" fill="{{t.ink}}"></rect><polygon points="100,4 122,10 100,16" fill="{{t.ember}}"></polygon>
<polygon points="20,58 100,24 180,58" fill="{{t.roof}}"></polygon>
<rect x="26" y="58" width="148" height="72" fill="{{t.stoneWall}}" stroke="{{t.line}}" stroke-width="2"></rect>
<rect x="38" y="64" width="10" height="66" fill="{{t.deck}}"></rect><rect x="66" y="64" width="10" height="66" fill="{{t.deck}}"></rect><rect x="124" y="64" width="10" height="66" fill="{{t.deck}}"></rect><rect x="152" y="64" width="10" height="66" fill="{{t.deck}}"></rect>
<path d="M86 130 V96 a14 14 0 0 1 28 0 V130 Z" fill="{{t.win}}"></path>
<rect x="10" y="130" width="180" height="12" fill="{{t.stone}}"></rect>
</svg>
<span style="padding: 4px 10px; border-radius: 8px; background: {{t.deck}}; border: 2px solid {{t.ink}}; font-family: 'Pixelify Sans', monospace; font-size: 15px; font-weight: 600">Town hall</span>
</a>

<a href="ProfileMobile.dc.html" style="position: absolute; left: 24%; top: 47%; translate: -50% -100%; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none">
<svg width="110" height="56" viewBox="0 0 220 110" aria-hidden="true">
<polygon points="6,52 40,22 74,52" fill="{{t.roof}}"></polygon><rect x="12" y="52" width="56" height="52" fill="{{t.wall}}"></rect><rect x="18" y="62" width="11" height="11" fill="{{t.win}}"></rect>
<polygon points="70,46 110,8 150,46" fill="{{t.roof2}}"></polygon><rect x="78" y="46" width="64" height="58" fill="{{t.wall}}"></rect><rect x="103" y="74" width="14" height="30" fill="{{t.door}}"></rect><rect x="85" y="56" width="13" height="13" fill="{{t.win}}"></rect>
<polygon points="146,56 180,28 214,56" fill="{{t.roof}}"></polygon><rect x="152" y="56" width="56" height="48" fill="{{t.wall}}"></rect><rect x="158" y="65" width="11" height="11" fill="{{t.win}}"></rect>
</svg>
<span style="padding: 4px 10px; border-radius: 8px; background: {{t.deck}}; border: 2px solid {{t.ink}}; font-family: 'Pixelify Sans', monospace; font-size: 15px; font-weight: 600">Houses</span>
</a>

<a href="CommunityCenterMobile.dc.html" style="position: absolute; left: 76%; top: 53%; translate: -50% -100%; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none">
<svg width="120" height="66" viewBox="0 0 200 110" aria-hidden="true">
<rect x="150" y="2" width="2" height="30" fill="{{t.ink}}"></rect><rect x="152" y="2" width="22" height="13" fill="{{t.cyanFill}}"></rect>
<rect x="10" y="34" width="180" height="12" rx="6" fill="{{t.roof2}}"></rect><rect x="18" y="46" width="164" height="60" fill="{{t.wall}}"></rect>
<circle cx="100" cy="64" r="11" fill="{{t.win}}"></circle><rect x="84" y="80" width="32" height="26" fill="{{t.door}}"></rect>
<rect x="32" y="60" width="30" height="18" fill="{{t.win}}"></rect><rect x="138" y="60" width="30" height="18" fill="{{t.win}}"></rect>
</svg>
<span style="padding: 4px 10px; border-radius: 8px; background: {{t.deck}}; border: 2px solid {{t.ink}}; font-family: 'Pixelify Sans', monospace; font-size: 15px; font-weight: 600">Community center</span>
</a>

<a href="NoticeBoardMobile.dc.html" style="position: absolute; left: 25%; top: 73%; translate: -50% -100%; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none">
<svg width="100" height="70" viewBox="0 0 150 104" aria-hidden="true">
<polygon points="4,16 75,2 146,16" fill="{{t.roof2}}"></polygon>
<rect x="18" y="16" width="8" height="88" fill="{{t.wood}}"></rect><rect x="124" y="16" width="8" height="88" fill="{{t.wood}}"></rect>
<rect x="10" y="18" width="130" height="64" fill="{{t.board}}"></rect>
<rect x="20" y="26" width="30" height="24" fill="#fff8dc"></rect><rect x="58" y="24" width="34" height="28" fill="#e3f1ff"></rect><rect x="100" y="28" width="30" height="22" fill="#ffe3ea"></rect><rect x="40" y="56" width="40" height="20" fill="#e6f7dc"></rect>
</svg>
<span style="padding: 4px 10px; border-radius: 8px; background: {{t.deck}}; border: 2px solid {{t.ink}}; font-family: 'Pixelify Sans', monospace; font-size: 15px; font-weight: 600">Notice board</span>
</a>

<a href="MarketMobile.dc.html" style="position: absolute; left: 76%; top: 77%; translate: -50% -100%; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none">
<svg width="110" height="52" viewBox="0 0 210 100" aria-hidden="true">
<rect x="10" y="20" width="4" height="78" fill="{{t.wood}}"></rect><rect x="88" y="20" width="4" height="78" fill="{{t.wood}}"></rect>
<rect x="6" y="14" width="90" height="22" fill="{{t.ember}}"></rect><rect x="6" y="66" width="90" height="32" fill="{{t.wood}}"></rect>
<rect x="118" y="20" width="4" height="78" fill="{{t.wood}}"></rect><rect x="196" y="20" width="4" height="78" fill="{{t.wood}}"></rect>
<rect x="114" y="14" width="90" height="22" fill="{{t.cyanFill}}"></rect><rect x="114" y="66" width="90" height="32" fill="{{t.wood}}"></rect>
</svg>
<span style="padding: 4px 10px; border-radius: 8px; background: {{t.deck}}; border: 2px solid {{t.ink}}; font-family: 'Pixelify Sans', monospace; font-size: 15px; font-weight: 600">Market</span>
</a>

<sc-for list="{{residents}}" as="r" hint-placeholder-count="5">
<svg class="at-walk" width="27" height="36" viewBox="0 0 12 16" shape-rendering="crispEdges" role="img" aria-label="Resident sprite" style="position: absolute; left: {{r.x}}; top: {{r.y}}; transform: scaleX({{r.flip}})">
<rect x="3" y="1" width="6" height="2" fill="{{r.hair}}"></rect><rect x="2" y="2" width="1" height="4" fill="{{r.hair}}"></rect><rect x="9" y="2" width="1" height="4" fill="{{r.hair}}"></rect>
<rect x="3" y="3" width="6" height="4" fill="{{r.skin}}"></rect><rect x="4" y="4" width="1" height="1" fill="#1a1440"></rect><rect x="7" y="4" width="1" height="1" fill="#1a1440"></rect>
<rect x="2" y="7" width="8" height="5" fill="{{r.shirt}}"></rect><rect x="1" y="8" width="1" height="3" fill="{{r.skin}}"></rect><rect x="10" y="8" width="1" height="3" fill="{{r.skin}}"></rect>
<rect x="3" y="12" width="2" height="3" fill="#3a3178"></rect><rect x="7" y="12" width="2" height="3" fill="#3a3178"></rect>
</svg>
</sc-for>
</section>
</main>

<nav aria-label="Places" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 6px 4px 10px; background: {{t.deck}}; border-top: 2px solid {{t.line}}">
<a href="TownMapMobile.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 52px; text-decoration: none; font-size: 12px; font-weight: 800; color: {{t.emberText}}"><span aria-hidden="true" style="width: 22px; height: 6px; border-radius: 3px; background: {{t.ember}}"></span>Square</a>
<a href="NoticeBoardMobile.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 52px; text-decoration: none; font-size: 12px; font-weight: 600; color: {{t.dim}}"><span aria-hidden="true" style="width: 22px; height: 6px"></span>Board</a>
<a href="LiveDrawMobile.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 52px; text-decoration: none; font-size: 12px; font-weight: 600; color: {{t.dim}}"><span aria-hidden="true" style="width: 22px; height: 6px"></span>Town hall</a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 52px; text-decoration: none; font-size: 12px; font-weight: 600; color: {{t.dim}}"><span aria-hidden="true" style="width: 22px; height: 6px"></span>Market</a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 52px; text-decoration: none; font-size: 12px; font-weight: 600; color: {{t.dim}}"><span aria-hidden="true" style="width: 22px; height: 6px"></span>My house</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"sky":{"editor":"enum","options":["day","dusk"],"default":"dusk"},"$preview":{"width":390,"height":980}}'>
const AT_THEME = {
  day: { sky1: '#4fb2ec', sky2: '#86cff3', sky3: '#bce6f7', sky4: '#ffe0b8', sky5: '#ffc98a', page: '#fdf4e6', deck: '#fffaf2', deck2: '#fff3e2', deckA: 'rgba(255,250,242,.92)', line: '#e8c9a3', ink: '#1a1440', dim: '#5f5585', ember: '#c43c14', emberText: '#b5360f', onEmber: '#fff6ef', glow: '#e0a23a', grass: '#9fd18a', grass2: '#7fbf72', path: '#f3dfb4', water: '#8fd3e8', stone: '#d9c7a8', stoneWall: '#f6ead8', roof: '#d0583c', roof2: '#3f7fb0', wall: '#fff3e2', door: '#7a4a2e', win: '#ffe7a3', wood: '#9a5f36', board: '#c98b55', cyanFill: '#2a93ad' },
  dusk: { sky1: '#0c0e2e', sky2: '#241a52', sky3: '#5c2f66', sky4: '#b94e69', sky5: '#ff8a4c', page: '#0c0e2e', deck: '#17123d', deck2: '#1f1a4e', deckA: 'rgba(23,18,61,.9)', line: '#3a3178', ink: '#f2eefc', dim: '#a9a0cd', ember: '#ff7a45', emberText: '#ff9a6e', onEmber: '#2a0f04', glow: '#ffc46b', grass: '#33406e', grass2: '#28325c', path: '#4d4280', water: '#3b5f9a', stone: '#5a4f8f', stoneWall: '#2f2866', roof: '#8a3a5a', roof2: '#3a4f8a', wall: '#2a2360', door: '#140f33', win: '#ffc46b', wood: '#6b4458', board: '#7a5468', cyanFill: '#6fd6e8' }
};
class Component extends DCLogic {
  state = {};
  renderVals() {
    const sky = this.state.sky || this.props.sky || 'dusk';
    const t = AT_THEME[sky] || AT_THEME.dusk;
    return {
      t,
      skyIsDay: sky === 'day',
      skyIsDusk: sky === 'dusk',
      skyAria: sky === 'day' ? 'Switch to dusk' : 'Switch to day',
      toggleSky: () => this.setState({ sky: sky === 'day' ? 'dusk' : 'day' }),
      residents: [
        { x: '44%', y: '82%', hair: '#5a3a2a', skin: '#f2c39b', shirt: '#2f8f83', flip: 1 },
        { x: '54%', y: '85%', hair: '#e8c34a', skin: '#c98b62', shirt: '#d0583c', flip: -1 },
        { x: '30%', y: '54%', hair: '#1a1440', skin: '#8d5a3c', shirt: '#7a5ac8', flip: 1 },
        { x: '62%', y: '60%', hair: '#c94f7c', skin: '#f2c39b', shirt: '#e0a23a', flip: -1 },
        { x: '45%', y: '37%', hair: '#8a3a2a', skin: '#f2c39b', shirt: '#1a7f96', flip: 1 }
      ],
      stars: [['8%','4%'],['20%','9%'],['34%','3%'],['47%','8%'],['58%','2%'],['66%','10%'],['90%','6%'],['14%','14%']].map(([x, y]) => ({ x, y }))
    };
  }
}
</script>
</body>
</html>
