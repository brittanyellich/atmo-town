<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>atmo.town: Notice board, mobile</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;family=Pixelify+Sans:wght@400;600&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}
</style>
</helmet>
<div style="position: relative; width: 390px; min-height: 1240px; box-sizing: border-box; display: flex; flex-direction: column; background: linear-gradient(180deg, {{t.sky2}} 0%, {{t.sky3}} 140px, {{t.page}} 320px); color: {{t.ink}}; font-family: 'Bricolage Grotesque', 'Trebuchet MS', sans-serif">

<header style="display: flex; align-items: center; gap: 8px; padding: 12px 16px; background: {{t.deckA}}; border-bottom: 2px solid {{t.line}}">
<a href="TownMapMobile.dc.html" style="display: flex; align-items: center; gap: 8px; flex: 1; text-decoration: none; font-family: 'Pixelify Sans', monospace; font-size: 22px; font-weight: 600">
<svg width="24" height="24" viewBox="0 0 14 14" shape-rendering="crispEdges" aria-hidden="true"><rect x="6" y="1" width="2" height="1" fill="{{t.ember}}"></rect><rect x="4" y="2" width="6" height="2" fill="{{t.ember}}"></rect><rect x="2" y="4" width="10" height="2" fill="{{t.ember}}"></rect><rect x="3" y="6" width="8" height="7" fill="{{t.wall}}" stroke="{{t.ink}}" stroke-width=".5"></rect><rect x="6" y="9" width="2" height="4" fill="{{t.ink}}"></rect><rect x="4" y="7" width="2" height="2" fill="{{t.win}}"></rect><rect x="8" y="7" width="2" height="2" fill="{{t.win}}"></rect></svg>
atmo.town
</a>
<button type="button" onClick="{{toggleSky}}" aria-label="{{skyAria}}" style="display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; border: 2px solid {{t.line}}; background: {{t.deck2}}; cursor: pointer"><span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 50%; background: {{t.glow}}"></span></button>
<a href="NotificationsMobile.dc.html" aria-label="Mailbox, 2 unread" style="position: relative; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; border: 2px solid {{t.line}}; background: {{t.deck2}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10a5 5 0 0 1 10 0v9H4z"></path><path d="M14 10h6v9h-6"></path><path d="M9 3v4h4"></path></svg>
<span aria-hidden="true" style="position: absolute; top: -4px; right: -4px; width: 12px; height: 12px; border-radius: 50%; background: {{t.ember}}; border: 2px solid {{t.deck}}"></span>
</a>
</header>

<main style="flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 18px 16px 110px">
<h1 style="margin: 0; font-size: 34px; line-height: 1; font-weight: 800; letter-spacing: -0.02em">Notice board</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.45; font-weight: 600; color: {{t.dim}}">Ideas that would make the Atmosphere better.</p>

<div role="tablist" aria-label="Filter ideas" style="display: flex; gap: 8px; margin: 0 -16px; padding: 2px 16px 6px; overflow-x: auto">
<sc-for list="{{tabs}}" as="tab" hint-placeholder-count="5">
<button type="button" role="tab" aria-selected="{{tab.selected}}" onClick="{{tab.pick}}" style="flex: none; min-height: 44px; padding: 0 16px; border-radius: 12px; border: 2px solid {{tab.border}}; background: {{tab.bg}}; color: {{tab.fg}}; font: 600 15px 'Bricolage Grotesque', sans-serif; cursor: pointer; white-space: nowrap">{{tab.label}}</button>
</sc-for>
</div>

<section aria-label="Ideas" style="display: flex; flex-direction: column; gap: 18px; padding: 20px 16px; border-radius: 18px; background: {{t.board}}; border: 8px solid {{t.wood}}">
<sc-for list="{{ideas}}" as="idea" hint-placeholder-count="4">
<a href="IdeaPageMobile.dc.html" style="position: relative; display: flex; flex-direction: column; gap: 10px; padding: 22px 18px 16px; background: {{idea.paper}}; color: #1a1440; text-decoration: none; transform: rotate({{idea.tilt}}); box-shadow: 0 8px 14px -8px rgba(30,15,10,.45)">
<span aria-hidden="true" style="position: absolute; top: 7px; left: 50%; translate: -50% 0; width: 12px; height: 12px; border-radius: 50%; background: {{idea.pin}}"></span>
<span style="align-self: flex-start; padding: 3px 8px; border-radius: 6px; background: rgba(26,20,64,.08); font-family: 'Pixelify Sans', monospace; font-size: 13px">{{idea.status}}</span>
<span style="font-size: 20px; line-height: 1.15; font-weight: 800">{{idea.title}}</span>
<span style="font-size: 15px; line-height: 1.45; color: #3b3360">{{idea.pitch}}</span>
<span style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 8px; border-top: 2px dashed rgba(26,20,64,.18); font-size: 13px; font-weight: 600; color: #3b3360">
<span>@{{idea.author}}</span>
<span>{{idea.use}} would use · {{idea.build}} building</span>
</span>
</a>
</sc-for>
</section>
</main>

<a href="PostIdeaMobile.dc.html" style="position: absolute; right: 16px; bottom: 86px; display: inline-flex; align-items: center; gap: 8px; min-height: 52px; padding: 0 20px; border-radius: 999px; background: {{t.ember}}; color: {{t.onEmber}}; text-decoration: none; font-weight: 800; font-size: 16px; box-shadow: 0 10px 24px -8px rgba(0,0,0,.45)">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
Post an idea
</a>

<nav aria-label="Places" style="position: absolute; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 6px 4px 10px; background: {{t.deck}}; border-top: 2px solid {{t.line}}">
<a href="TownMapMobile.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 52px; text-decoration: none; font-size: 12px; font-weight: 600; color: {{t.dim}}"><span aria-hidden="true" style="width: 22px; height: 6px"></span>Square</a>
<a href="NoticeBoardMobile.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 52px; text-decoration: none; font-size: 12px; font-weight: 800; color: {{t.emberText}}"><span aria-hidden="true" style="width: 22px; height: 6px; border-radius: 3px; background: {{t.ember}}"></span>Board</a>
<a href="LiveDrawMobile.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 52px; text-decoration: none; font-size: 12px; font-weight: 600; color: {{t.dim}}"><span aria-hidden="true" style="width: 22px; height: 6px"></span>Town hall</a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 52px; text-decoration: none; font-size: 12px; font-weight: 600; color: {{t.dim}}"><span aria-hidden="true" style="width: 22px; height: 6px"></span>Market</a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 52px; text-decoration: none; font-size: 12px; font-weight: 600; color: {{t.dim}}"><span aria-hidden="true" style="width: 22px; height: 6px"></span>My house</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"sky":{"editor":"enum","options":["day","dusk"],"default":"day"},"$preview":{"width":390,"height":1240}}'>
const AT_THEME = {
  day: { sky2: '#86cff3', sky3: '#bce6f7', page: '#fdf4e6', deck: '#fffaf2', deck2: '#fff3e2', deckA: 'rgba(255,250,242,.92)', line: '#e8c9a3', ink: '#1a1440', dim: '#5f5585', ember: '#c43c14', emberText: '#b5360f', onEmber: '#fff6ef', glow: '#e0a23a', wall: '#fff3e2', win: '#ffe7a3', wood: '#9a5f36', board: '#c98b55' },
  dusk: { sky2: '#241a52', sky3: '#5c2f66', page: '#0c0e2e', deck: '#17123d', deck2: '#1f1a4e', deckA: 'rgba(23,18,61,.9)', line: '#3a3178', ink: '#f2eefc', dim: '#a9a0cd', ember: '#ff7a45', emberText: '#ff9a6e', onEmber: '#2a0f04', glow: '#ffc46b', wall: '#2a2360', win: '#ffc46b', wood: '#4a2f45', board: '#6b4a5e' }
};
const AT_TABS = ['New', 'Most wanted', 'Needs builders', 'Shipped', 'Spotted on Bluesky'];
class Component extends DCLogic {
  state = { tab: 'New' };
  renderVals() {
    const sky = this.state.sky || this.props.sky || 'day';
    const t = AT_THEME[sky] || AT_THEME.day;
    const tabs = AT_TABS.map((label) => {
      const on = this.state.tab === label;
      return { label, selected: on ? 'true' : 'false', bg: on ? t.ink : t.deck, fg: on ? t.deck : t.ink, border: on ? t.ink : t.line, pick: () => this.setState({ tab: label }) };
    });
    const ideas = [
      { title: 'Atmosphere Wrapped, made with Teal', pitch: 'A year-end recap of what you listened to, posted, and built across Atmosphere apps.', author: 'maple.example', status: 'Has builders', use: 31, build: 2, paper: '#fff8dc', tilt: '-1deg', pin: '#c43c14' },
      { title: 'Reading lists any app can show', pitch: 'One list of books and articles you can carry between reader apps.', author: 'fern.example', status: 'Needs builders', use: 18, build: 0, paper: '#e3f1ff', tilt: '0.8deg', pin: '#1a7f96' },
      { title: 'RSVPs that every calendar can read', pitch: 'Say you are going once and have it show up wherever you keep your schedule.', author: 'otter.example', status: 'Being built', use: 24, build: 3, paper: '#ffe3ea', tilt: '-0.5deg', pin: '#7a5ac8' },
      { title: 'A first-week guide for new protocol devs', pitch: 'A friendly path from "what is a PDS" to shipping a tiny app.', author: 'juniper.example', status: 'Needs builders', use: 12, build: 0, paper: '#e6f7dc', tilt: '1deg', pin: '#2f8f83' }
    ];
    return {
      t,
      skyAria: sky === 'day' ? 'Switch to dusk' : 'Switch to day',
      toggleSky: () => this.setState({ sky: sky === 'day' ? 'dusk' : 'day' }),
      tabs,
      ideas
    };
  }
}
</script>
</body>
</html>
