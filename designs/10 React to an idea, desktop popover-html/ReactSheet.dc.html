<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>atmo.town: React to an idea</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;family=Pixelify+Sans:wght@400;600&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}
</style>
</helmet>
<div style="position: relative; min-height: 100vh; display: flex; flex-direction: column; background: {{t.page}}; color: {{t.ink}}; font-family: 'Bricolage Grotesque', 'Trebuchet MS', sans-serif; overflow: hidden">

<div aria-hidden="true" style="flex: 1; display: flex; justify-content: center; padding: {{s.backPad}}; filter: blur(1px)">
<div style="width: 100%; max-width: 760px; display: flex; flex-direction: column; gap: 14px; padding: 36px 32px; background: #fff8dc; color: #1a1440; transform: rotate(-0.4deg); align-self: flex-start">
<span style="font-family: 'Pixelify Sans', monospace; font-size: 14px">Has builders</span>
<span style="font-size: {{s.backH}}; line-height: 1.05; font-weight: 800">Atmosphere Wrapped, made with Teal</span>
<span style="font-size: 17px; line-height: 1.5">A year-end recap of what you listened to, posted, and built across Atmosphere apps.</span>
</div>
</div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(12,14,46,.55)"></div>

<div role="dialog" aria-modal="true" aria-labelledby="react-h" style="position: absolute; left: {{s.left}}; right: {{s.right}}; top: {{s.top}}; bottom: {{s.bottom}}; translate: {{s.tx}}; width: {{s.w}}; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; padding: {{s.card}}; background: {{t.deck}}; border: 3px solid {{t.line}}; border-radius: {{s.radius}}; box-shadow: 0 24px 60px -16px rgba(0,0,0,.6)">
<sc-if value="{{m}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="align-self: center; width: 48px; height: 5px; border-radius: 3px; background: {{t.line}}"></span></sc-if>
<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h2 id="react-h" style="margin: 0; font-size: 24px; font-weight: 800">How would you join in?</h2>
<p style="margin: 0; font-size: 15px; color: {{t.dim}}">Atmosphere Wrapped, made with Teal</p>
</div>
<a href="{{go.idea}}" aria-label="Close" style="display: grid; place-items: center; flex: none; width: 44px; height: 44px; border-radius: 12px; border: 2px solid {{t.line}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
</div>

<div role="radiogroup" aria-label="Your reaction" style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{options}}" as="o" hint-placeholder-count="3">
<button type="button" role="radio" aria-checked="{{o.checked}}" onClick="{{o.pick}}" style="display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 10px 16px; border-radius: 16px; border: 3px solid {{o.border}}; background: {{o.bg}}; color: {{t.ink}}; font-family: 'Bricolage Grotesque', sans-serif; text-align: left; cursor: pointer">
<span aria-hidden="true" style="display: grid; place-items: center; flex: none; width: 24px; height: 24px; border-radius: 50%; border: 3px solid {{o.ring}}"><span style="width: 10px; height: 10px; border-radius: 50%; background: {{o.dot}}"></span></span>
<span style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 17px; font-weight: 800">{{o.label}}</span>
<span style="font-size: 14px; color: {{t.dim}}">{{o.hint}}</span>
</span>
</button>
</sc-for>
</div>

<sc-if value="{{isHelp}}" hint-placeholder-val="{{ true }}">
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="padding: 0 0 8px; font-size: 15px; font-weight: 800">What could you help with?</legend>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{helps}}" as="h" hint-placeholder-count="4">
<button type="button" aria-pressed="{{h.pressed}}" onClick="{{h.toggle}}" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 2px solid {{h.border}}; background: {{h.bg}}; color: {{h.fg}}; font: 700 14px 'Bricolage Grotesque', sans-serif; cursor: pointer">{{h.label}}</button>
</sc-for>
</div>
</fieldset>
</sc-if>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="note" style="font-size: 15px; font-weight: 800">Add a note <span style="font-weight: 500; color: {{t.dim}}">(optional)</span></label>
<textarea id="note" rows="3" placeholder="I've worked with the Teal lexicons before…" style="padding: 10px 12px; border-radius: 12px; border: 2px solid {{t.line}}; background: {{t.deck2}}; color: {{t.ink}}; font: 500 15px/1.5 'Bricolage Grotesque', sans-serif; resize: vertical"></textarea>
</div>

<div style="display: flex; gap: 10px; justify-content: flex-end">
<a href="{{go.idea}}" style="display: inline-flex; align-items: center; justify-content: center; min-height: 50px; padding: 0 20px; border-radius: 999px; border: 2px solid {{t.ink}}; text-decoration: none; font-weight: 800; font-size: 15px; flex: {{s.btnFlex}}">Cancel</a>
<a href="{{go.idea}}" style="display: inline-flex; align-items: center; justify-content: center; min-height: 50px; padding: 0 22px; border-radius: 999px; background: {{t.ember}}; color: {{t.onEmber}}; text-decoration: none; font-weight: 800; font-size: 15px; flex: {{s.btnFlex}}">Add my reaction</a>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"sky":{"editor":"enum","options":["day","dusk"],"default":"day"},"device":{"editor":"enum","options":["desktop","mobile"],"default":"desktop"},"$preview":{"width":1440,"height":1000}}'>
const AT_THEME = {
  day: { page: '#fdf4e6', deck: '#fffaf2', deck2: '#fff3e2', line: '#e8c9a3', ink: '#1a1440', dim: '#5f5585', ember: '#c43c14', onEmber: '#fff6ef', picked: '#ffe9dc' },
  dusk: { page: '#0c0e2e', deck: '#17123d', deck2: '#1f1a4e', line: '#3a3178', ink: '#f2eefc', dim: '#a9a0cd', ember: '#ff7a45', onEmber: '#2a0f04', picked: '#3a2150' }
};
class Component extends DCLogic {
  state = { pick: 'help', helps: { Design: true } };
  renderVals() {
    const sky = this.state.sky || this.props.sky || 'day';
    const t = AT_THEME[sky] || AT_THEME.day;
    const m = this.props.device === 'mobile';
    const pick = this.state.pick;
    const options = [
      { key: 'use', label: "I'd use this", hint: 'Tell the poster people want it' },
      { key: 'build', label: "I'd build this", hint: 'Join the crew as a builder' },
      { key: 'help', label: "I'd help", hint: 'Design, spec writing, testing, or docs' }
    ].map((o) => {
      const on = pick === o.key;
      return { ...o, checked: on ? 'true' : 'false', bg: on ? t.picked : t.deck2, border: on ? t.ember : t.line, ring: on ? t.ember : t.line, dot: on ? t.ember : 'transparent', pick: () => this.setState({ pick: o.key }) };
    });
    const hs = this.state.helps;
    const helps = ['Design', 'Spec writing', 'Testing', 'Docs'].map((label) => {
      const on = !!hs[label];
      return { label, pressed: on ? 'true' : 'false', bg: on ? t.ink : t.deck2, fg: on ? t.deck : t.ink, border: on ? t.ink : t.line, toggle: () => this.setState({ helps: { ...hs, [label]: !on } }) };
    });
    return {
      t, m,
      go: { idea: m ? 'IdeaPageMobile.dc.html' : 'IdeaPage.dc.html' },
      s: m
        ? { backPad: '24px 16px', backH: '30px', left: '0', right: '0', top: 'auto', bottom: '0', tx: 'none', w: 'auto', card: '14px 18px 22px', radius: '24px 24px 0 0', btnFlex: '1 1 0' }
        : { backPad: '80px 32px', backH: '46px', left: '50%', right: 'auto', top: '120px', bottom: 'auto', tx: '-50% 0', w: '520px', card: '26px', radius: '24px', btnFlex: '0 0 auto' },
      options,
      isHelp: pick === 'help',
      helps
    };
  }
}
</script>
</body>
</html>
